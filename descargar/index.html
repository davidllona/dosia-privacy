<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Descarga Dosia</title>
<meta name="description" content="Dosia, tu compañera de turno: fármacos oficiales de la AEMPS, escalas, urgencias y más de 2.600 preguntas oficiales EIR/MIR. Gratis y sin registro.">
<meta name="theme-color" content="#0E8F85">
<meta property="og:title" content="Dosia · Tu compañera de turno">
<meta property="og:description" content="Fármacos oficiales, escalas, urgencias y el EIR jugando. Gratis en App Store y Google Play.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{min-height:100%}
  body{font-family:Nunito,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;overflow-x:hidden;
       background:linear-gradient(165deg,#1CC0B0 0%,#0E8F85 55%,#0A5F59 100%);background-attachment:fixed}
  /* fondo: burbujas que suben y línea de vida */
  .bubbles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .bubbles span{position:absolute;bottom:-60px;border-radius:50%;background:rgba(255,255,255,.14);animation:rise linear infinite}
  @keyframes rise{to{transform:translateY(-115vh) scale(1.2);opacity:0}}
  .ecg{position:fixed;left:0;bottom:0;width:100%;height:110px;z-index:0;pointer-events:none;opacity:.5}

  main{position:relative;z-index:1;max-width:440px;margin:0 auto;padding:36px 22px 120px;text-align:center}
  .dosi{width:132px;margin:0 auto;display:block;animation:drop .9s cubic-bezier(.3,1.6,.5,1) both, float 3.2s ease-in-out .9s infinite}
  @keyframes drop{from{transform:translateY(-140px) scale(.6);opacity:0}to{transform:none;opacity:1}}
  @keyframes float{50%{transform:translateY(-10px)}}
  .shadow{width:80px;height:12px;margin:2px auto 0;border-radius:50%;background:rgba(0,0,0,.18);animation:sh 3.2s ease-in-out .9s infinite}
  @keyframes sh{50%{transform:scale(.8);opacity:.6}}
  h1{font-size:64px;font-weight:900;letter-spacing:-2px;line-height:1;margin-top:10px}
  h1 span{display:inline-block;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
  @keyframes pop{from{transform:translateY(40px) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
  .tag{font-size:20px;font-weight:800;color:#C8FFEE;margin-top:6px;animation:up .6s .9s both}
  @keyframes up{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}

  /* frase que va cambiando */
  .rot{height:34px;margin:22px 0 4px;position:relative;font-size:21px;font-weight:900;animation:up .6s 1.1s both}
  .rot div{position:absolute;inset:0;opacity:0;transform:translateY(16px);transition:.45s}
  .rot div.on{opacity:1;transform:none}
  .rot b{color:#FFE29A}

  /* botones de tienda */
  .stores{display:grid;gap:12px;margin-top:22px}
  .btn{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;text-decoration:none;color:#fff;
       background:#101E2B;border-radius:18px;padding:14px 20px;text-align:left;box-shadow:0 12px 30px rgba(0,0,0,.25);
       animation:up .6s both;transition:transform .15s}
  .btn:active{transform:scale(.97)}
  .btn .ic{width:34px;height:34px;flex:none;color:currentColor}
  .btn small{display:block;font-size:12px;font-weight:800;opacity:.8;letter-spacing:.3px}
  .btn strong{display:block;font-size:22px;font-weight:900;line-height:1.1}
  .btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
       background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-20deg);animation:shine 3.5s 2s infinite}
  @keyframes shine{0%{left:-60%}35%,100%{left:130%}}
  .btn.ios{animation-delay:1.3s}.btn.play{animation-delay:1.45s}
  .btn.mine{background:#fff;color:#0A5F59;animation:up .6s 1.3s both, pulse 1.6s 2s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 12px 30px rgba(0,0,0,.25),0 0 0 0 rgba(255,255,255,.6)}60%{box-shadow:0 12px 30px rgba(0,0,0,.25),0 0 0 14px rgba(255,255,255,0)}}
  .opening{font-size:14px;font-weight:800;color:#E6FFF8;margin-top:12px;min-height:18px}
  .bar{height:5px;border-radius:5px;background:rgba(255,255,255,.2);overflow:hidden;margin:6px auto 0;width:60%;display:none}
  .bar i{display:block;height:100%;width:0;background:#fff;border-radius:5px}

  /* chips de funciones */
  .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:28px}
  .chip{background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.35);border-radius:30px;padding:8px 14px;font-size:14px;font-weight:800;
        animation:up .5s both}
  /* contador */
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:26px}
  .stat{background:rgba(0,0,0,.14);border-radius:18px;padding:14px 6px;animation:up .6s both}
  .stat b{display:block;font-size:26px;font-weight:900}
  .stat span{font-size:12px;font-weight:800;color:#C8FFEE}
  .note{font-size:12px;color:rgba(255,255,255,.7);margin-top:26px;line-height:1.45}
  canvas#conf{position:fixed;inset:0;pointer-events:none;z-index:5}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
<div class="bubbles" id="bubbles"></div>
<canvas class="ecg" id="ecg" aria-hidden="true"></canvas>
<canvas id="conf"></canvas>
<main>
  <svg class="dosi" viewBox="60 30 280 410" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4FE0C8"/><stop offset="1" stop-color="#16B3A5"/></linearGradient></defs><path d="M200 40 C200 40 70 196 70 283.8 A130 130.2 0 0 0 330 283.8 C330 196 200 40 200 40 Z" fill="url(#g)" stroke="#fff" stroke-width="6"/><path d="M150 118 L250 118 L240 78 Q200 62 160 78 Z" fill="#fff"/><rect x="193" y="84" width="14" height="30" rx="4" fill="#FF7A6B"/><rect x="185" y="92" width="30" height="14" rx="4" fill="#FF7A6B"/><g id="eyes"><ellipse cx="160" cy="270" rx="16" ry="20" fill="#1F2D3D"/><ellipse cx="240" cy="270" rx="16" ry="20" fill="#1F2D3D"/><circle cx="166" cy="262" r="6" fill="#fff"/><circle cx="246" cy="262" r="6" fill="#fff"/></g><ellipse cx="135" cy="305" rx="16" ry="9" fill="#FF9AA8" opacity=".7"/><ellipse cx="265" cy="305" rx="16" ry="9" fill="#FF9AA8" opacity=".7"/><path d="M178 316 Q200 334 222 316" fill="none" stroke="#1F2D3D" stroke-width="9" stroke-linecap="round"/></svg>
  <div class="shadow"></div>
  <h1 id="title"></h1>
  <p class="tag">Tu compañera de turno</p>

  <div class="rot" id="rot">
    <div class="on">Fármacos con datos <b>oficiales</b></div>
    <div>Prepara el <b>EIR</b> jugando</div>
    <div>Escalas y urgencias <b>en un toque</b></div>
    <div>Tu <b>CV</b> siempre a mano</div>
    <div><b>Gratis</b> y sin registro</div>
  </div>

  <div class="stores" id="stores">
    <a class="btn ios" id="ios" href="https://apps.apple.com/es/app/dosia/id6817307810">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18.71 19.5C17.88 20.74 17 21.95 15.66 21.97C14.32 22 13.89 21.18 12.37 21.18C10.84 21.18 10.37 21.95 9.09997 22C7.78997 22.05 6.79997 20.68 5.95997 19.47C4.24997 17 2.93997 12.45 4.69997 9.39C5.56997 7.87 7.12997 6.91 8.81997 6.88C10.1 6.86 11.32 7.75 12.11 7.75C12.89 7.75 14.37 6.68 15.92 6.84C16.57 6.87 18.39 7.1 19.56 8.82C19.47 8.88 17.39 10.1 17.41 12.63C17.44 15.65 20.06 16.66 20.09 16.67C20.06 16.74 19.67 18.11 18.71 19.5ZM13 3.5C13.73 2.67 14.94 2.04 15.94 2C16.07 3.17 15.6 4.35 14.9 5.19C14.21 6.04 13.07 6.7 11.95 6.61C11.8 5.46 12.36 4.26 13 3.5Z"/></svg><span><small>Descárgala en el</small><strong>App Store</strong></span></a>
    <a class="btn play" id="play" href="https://play.google.com/store/apps/details?id=com.dosia.mobile">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" clip-rule="evenodd" d="M2 3.65629C2 2.15127 3.59967 1.18549 4.93149 1.88645L20.7844 10.2301C22.2091 10.9799 22.2091 13.0199 20.7844 13.7698L4.9315 22.1134C3.59968 22.8144 2 21.8486 2 20.3436V3.65629ZM19.8529 11.9999L16.2682 10.1132L14.2243 11.9999L16.2682 13.8866L19.8529 11.9999ZM14.3903 14.875L12.75 13.3608L6.75782 18.8921L14.3903 14.875ZM12.75 10.639L14.3903 9.12488L6.75782 5.10777L12.75 10.639ZM4 5.28391L11.2757 11.9999L4 18.7159V5.28391Z"/></svg><span><small>Disponible en</small><strong>Google Play</strong></span></a>
  </div>
  <p class="opening" id="opening"></p>
  <div class="bar" id="bar"><i id="barfill"></i></div>

  <div class="stats">
    <div class="stat" style="animation-delay:1.7s"><b data-n="2600" data-pre="+">0</b><span>preguntas oficiales EIR y MIR</span></div>
    <div class="stat" style="animation-delay:1.8s"><b>Gratis</b><span>y sin registro</span></div>
  </div>  </div>


</main>
<script>

  // Línea de vida tipo monitor: barre de izquierda a derecha sin cortes, con un hueco delante del punto
  (function(){var cv=document.getElementById('ecg'),c=cv.getContext('2d'),dpr=Math.min(2,window.devicePixelRatio||1),W,H,buf;
    function fit(){W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;c.setTransform(dpr,0,0,dpr,0,0);buf=new Float32Array(Math.ceil(W)+1).fill(NaN)}
    fit();addEventListener('resize',fit);
    function y(ph){if(ph<.08)return -5*Math.sin(ph/.08*Math.PI);if(ph<.14)return 0;if(ph<.18)return 10*((ph-.14)/.04);if(ph<.24)return 10-(ph-.18)/.06*62;if(ph<.3)return -52+(ph-.24)/.06*60;if(ph<.34)return 8-(ph-.3)/.04*8;if(ph<.55)return 0;if(ph<.75)return -10*Math.sin((ph-.55)/.2*Math.PI);return 0}
    var x=0,last=performance.now(),SPEED=260,BEAT=230,GAP=40;
    function frame(now){var dt=Math.min(50,now-last)/1000;last=now;var nx=x+SPEED*dt;
      for(var i=Math.floor(x);i<=Math.floor(nx);i++){var xi=i%Math.ceil(W);buf[xi]=H*.62+y((i%BEAT)/BEAT);for(var g=1;g<=GAP;g++)buf[(xi+g)%Math.ceil(W)]=NaN}
      x=nx;c.clearRect(0,0,W,H);
      [[10,'rgba(120,245,205,.25)'],[3,'#C8FFEE']].forEach(function(st){c.beginPath();c.lineWidth=st[0];c.strokeStyle=st[1];c.lineJoin='round';c.lineCap='round';var pen=false;
        for(var k=0;k<buf.length;k++){var v=buf[k];if(isNaN(v)){pen=false;continue}if(!pen){c.moveTo(k,v);pen=true}else c.lineTo(k,v)}c.stroke()});
      var hx=Math.floor(x)%Math.ceil(W),hy=buf[hx];if(!isNaN(hy)){c.beginPath();c.fillStyle='#fff';c.shadowColor='#9FF5DC';c.shadowBlur=14;c.arc(hx,hy,4,0,7);c.fill();c.shadowBlur=0}
      requestAnimationFrame(frame)}
    if(!matchMedia('(prefers-reduced-motion: reduce)').matches)requestAnimationFrame(frame);
  })();
  // Título letra a letra
  var t=document.getElementById('title');"Dosia".split('').forEach(function(c,i){var s=document.createElement('span');s.textContent=c;s.style.animationDelay=(.45+i*.08)+'s';t.appendChild(s)});
  // Burbujas
  var bb=document.getElementById('bubbles');for(var i=0;i<16;i++){var s=document.createElement('span'),z=10+Math.random()*34;s.style.width=s.style.height=z+'px';s.style.left=Math.random()*100+'%';s.style.animationDuration=(7+Math.random()*9)+'s';s.style.animationDelay=(-Math.random()*12)+'s';bb.appendChild(s)}
  // Frases rotando
  var r=document.querySelectorAll('#rot div'),k=0;setInterval(function(){r[k].className='';k=(k+1)%r.length;r[k].className='on'},2200);
  // Contadores
  setTimeout(function(){document.querySelectorAll('[data-n]').forEach(function(el){var n=+el.dataset.n,t0=performance.now();(function f(now){var p=Math.min(1,(now-t0)/1400),e=1-Math.pow(1-p,3);el.textContent=(el.dataset.pre||'')+Math.round(n*e).toLocaleString('es-ES');if(p<1)requestAnimationFrame(f)})(t0)})},1800);
  // Parpadeo de Dosi
  var eyes=document.getElementById('eyes');setInterval(function(){eyes.style.transformOrigin='200px 270px';eyes.style.transform='scaleY(.1)';setTimeout(function(){eyes.style.transform=''},140)},3800);
  // Confeti al pulsar un botón
  var cv=document.getElementById('conf'),cx=cv.getContext('2d');function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener('resize',size);
  function confetti(x,y){var P=[];for(var i=0;i<80;i++){var a=Math.random()*Math.PI*2,v=4+Math.random()*7;P.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-5,c:['#FFE29A','#FF7A6B','#C8FFEE','#fff','#8E7CFF'][i%5],r:Math.random()*6,s:5+Math.random()*6})}
    var n=0;(function f(){cx.clearRect(0,0,cv.width,cv.height);P.forEach(function(p){p.vy+=.25;p.x+=p.vx;p.y+=p.vy;p.r+=.2;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()});if(++n<70)requestAnimationFrame(f);else cx.clearRect(0,0,cv.width,cv.height)})()}
  document.querySelectorAll('.btn').forEach(function(b){b.addEventListener('click',function(e){var r=b.getBoundingClientRect();confetti(r.left+r.width/2,r.top+r.height/2)})});
  // Detección de móvil: su tienda primero, resaltada, y se abre sola en 3 s
  var ua=navigator.userAgent||"",isAndroid=/android/i.test(ua),isIOS=/iphone|ipad|ipod/i.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  var mine=isAndroid?document.getElementById('play'):isIOS?document.getElementById('ios'):null;
  if(mine){var st=document.getElementById('stores');st.insertBefore(mine,st.firstChild);mine.classList.add('mine');
    var name=isIOS?'App Store':'Google Play',op=document.getElementById('opening'),bar=document.getElementById('bar'),fill=document.getElementById('barfill');
    setTimeout(function(){op.textContent='Abriendo '+name+'…';bar.style.display='block';var t0=performance.now(),D=2600;
      (function f(now){var p=Math.min(1,(now-t0)/D);fill.style.width=(p*100)+'%';if(p<1)requestAnimationFrame(f);else{var r=mine.getBoundingClientRect();confetti(r.left+r.width/2,r.top+r.height/2);setTimeout(function(){location.href=mine.href},350)}})(t0)},1500);
  }
</script>
</body></html>
